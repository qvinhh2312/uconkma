name: Maven CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check repository formatting
        run: mvn -f engine/pom.xml -Pformat-check spotless:check

      - name: Build DSL module
        run: mvn -f dsl/pom.xml clean install

      - name: Test engine module
        run: mvn -f engine/pom.xml clean test
